<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TuitionDesk</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4f6fb;--card:#fff;--tx:#1b2433;--mu:#6b7589;--pr:#3b5bdb;--ok:#2f9e44;--bad:#e03131;--ln:#e5e9f2;--wa:#25d366}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1420;--card:#1a2132;--tx:#eef1f8;--mu:#97a1b6;--pr:#7c96ff;--ok:#51cf66;--bad:#ff6b6b;--ln:#2a3248}}
*{box-sizing:inherit}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
header{padding:14px 16px 6px}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
main{padding:8px 14px;max-width:560px;margin:auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:600}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;color:#fff;background:var(--pr);width:100%;text-align:center;display:block;text-decoration:none;cursor:pointer}
.btn.wa{background:var(--wa);color:#073b1a}.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.tag{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.g{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pa{display:flex;gap:6px}.pa button{width:44px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-weight:700;font-size:15px}
.pa .p.on{background:var(--ok);color:#fff;border-color:var(--ok)}.pa .a.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.big{font-size:26px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .c{margin:0}
.bar{height:12px;border-radius:99px;background:color-mix(in srgb,var(--bad) 30%,transparent);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.chart div{flex:1;text-align:center;font-size:12px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart b{display:block;background:var(--pr);border-radius:6px 6px 0 0;color:#fff;font-size:11px;padding-top:2px;min-height:16px}
input{font-size:16px!important}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 8px;font-size:11px;font-weight:600}nav button span{display:block;font-size:19px}nav button.on{color:var(--pr)}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#sh.on{display:flex}
#sh>div{background:var(--bg);width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:14px;max-width:560px;margin:auto}
a.sent{opacity:.5}
ul{margin:6px 0 0;padding-left:18px}
</style></head><body>
<header><h1>📚 TuitionDesk</h1><p>Sunrise Tuition Centre · Pune</p></header>
<main id="v"></main>
<nav id="nv"></nav>
<div id="sh" onclick="if(event.target===this){this.classList.remove('on');go()}"><div id="shc"></div></div>
<script>
let S=[
{n:"Aarav Patil",p:"Mr. Patil",ph:"919800000001",due:2500,late:12,att:92,sc:[62,68,71,70,78,82]},
{n:"Diya Sharma",p:"Mrs. Sharma",ph:"919800000002",due:0,late:0,att:96,sc:[80,84,79,88,90,91]},
{n:"Rohan Kulkarni",p:"Mr. Kulkarni",ph:"919800000003",due:5000,late:21,att:74,sc:[48,55,52,60,58,63]},
{n:"Sneha Joshi",p:"Mrs. Joshi",ph:"919800000004",due:2500,late:5,att:88,sc:[70,66,74,77,75,80]},
{n:"Kabir Singh",p:"Mr. Singh",ph:"919800000005",due:0,late:0,att:81,sc:[58,61,65,63,70,72]},
{n:"Ananya Desai",p:"Mrs. Desai",ph:"919800000006",due:2500,late:2,att:94,sc:[85,87,90,86,92,94]},
{n:"Yash Mehta",p:"Mr. Mehta",ph:"919800000007",due:5000,late:30,att:68,sc:[40,45,42,50,47,52]},
{n:"Isha Nair",p:"Mrs. Nair",ph:"919800000008",due:0,late:0,att:90,sc:[66,72,70,76,79,83]}];
const COLLECTED=48500,UPI="tuitiondesk@upi";
function save(){try{localStorage.setItem("td_students",JSON.stringify(S))}catch(e){}}
try{const x=JSON.parse(localStorage.getItem("td_students")||"null");if(Array.isArray(x)&&x.length&&x.every(o=>o&&o.n&&Array.isArray(o.sc)&&o.sc.length==6&&o.due>=0)&&x.some(o=>o.due>0))S=x}catch(e){}
const esc=s=>String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;");
const HW=["Maths: Ex 4.2, Q1–10 (due Wed)","Science: Draw and label the human eye","English: Write a 150-word letter"];
const ENQ=[["Mrs. Rao","Referred by Diya Sharma","New"],["Mr. Gupta","Referred by Aarav Patil","Called"],["Mrs. Iyer","Referred by Ananya Desai","New"]];
const T=["Maths Wk 1","Wk 2","Wk 3","Wk 4","Wk 5","Wk 6"];
const rank=i=>[...S].sort((a,b)=>b.sc[5]-a.sc[5]).findIndex(s=>s===S[i])+1;
const wa=(ph,m)=>`https://wa.me/${ph}?text=${encodeURIComponent(m)}`;
const inr=n=>"₹"+n.toLocaleString("en-IN");
let pend,pendTotal;
function calc(){pend=S.filter(s=>s.due>0).sort((a,b)=>b.late-a.late);pendTotal=pend.reduce((t,s)=>t+s.due,0)}
calc();
let tab=0,sel=0,mark=S.map(()=>"P");
const tabs=[["💰","Fees"],["✅","Attendance"],["📝","Tests"],["👪","Parent"],["📊","Owner"]];
const opts=()=>`<select onchange="sel=+this.value;go()">${S.map((s,i)=>`<option value="${i}" ${i==sel?"selected":""}>${s.n}</option>`).join("")}</select>`;
function sheet(title,items,note){
 shc.innerHTML=`<div class="r"><b>${title}</b><button class="btn sm" style="background:var(--mu)" onclick="sh.classList.remove('on')">Close</button></div><p class="mu">${note}</p>`+
 items.map(x=>`<div class="c r"><div><div class="b">${x.l}</div><div class="mu">${x.s}</div></div><a class="btn wa sm" target="_blank" rel="noopener" href="${x.h}" onclick="this.classList.add('sent');this.textContent='Sent ✓'">WhatsApp</a></div>`).join("");
 sh.classList.add("on")}
function fees(){return `<div class="c"><div class="mu">Total pending</div><div class="big">${inr(pendTotal)}</div><div class="mu">${pend.length} students</div></div>
<button class="btn wa" onclick="remindAll()">Send WhatsApp reminder to all</button>`+
pend.map(s=>`<div class="c r"><div><div class="b">${s.n}</div><div class="mu">${s.p}</div></div><div style="text-align:right"><div class="b">${inr(s.due)}</div><span class="tag">${s.late} days late</span></div></div>`).join("")}
function remindAll(){sheet("Fee reminders",pend.map(s=>({l:s.p,s:`${s.n} · ${inr(s.due)} · ${s.late} days late`,h:wa(s.ph,`Dear ${s.p}, fee of ${inr(s.due)} for ${s.n} is pending (${s.late} days late). Please pay via UPI ${UPI}. Thank you – Sunrise Tuition`)})),"WhatsApp opens one chat at a time. Tap each parent to send.")}
function att(){return `<div class="c"><div class="b">Class 10 · Maths Batch</div><div class="mu">Today, 5:00 PM · ${S.length} students</div></div>`+
S.map((s,i)=>`<div class="c r"><div class="b">${s.n}</div><div class="pa"><button class="p ${mark[i]=="P"?"on":""}" onclick="mark[${i}]='P';go()">P</button><button class="a ${mark[i]=="A"?"on":""}" onclick="mark[${i}]='A';go()">A</button></div></div>`).join("")+
`<button class="btn" onclick="saveAtt()">Save &amp; alert parents of absentees</button>`}
function saveAtt(){const a=S.map((s,i)=>[s,i]).filter(x=>mark[x[1]]=="A");
 if(!a.length){toast("Saved. Everyone is present 🎉");return}
 sheet("Absent alerts saved",a.map(([s])=>({l:s.p,s:`${s.n} was absent today`,h:wa(s.ph,`Dear ${s.p}, ${s.n} was absent from today’s Maths batch at Sunrise Tuition. Please let us know if all is well.`)})),"Attendance saved. Send the alert to each parent.")}
function tests(){const s=S[sel],m=Math.max(...s.sc,1);
 const msg=`📝 Weekly report – ${s.n}\nLatest score: ${s.sc[5]}/100\nClass rank: ${rank(sel)} of ${S.length}\nLast 6 tests: ${s.sc.join(", ")}\n– Sunrise Tuition`;
 return `<div class="c">${opts()}</div><div class="grid"><div class="c"><div class="mu">This week</div><div class="big">${s.sc[5]}/100</div></div><div class="c"><div class="mu">Class rank</div><div class="big">#${rank(sel)}</div></div></div>
<div class="c"><div class="b">Last 6 tests</div><div class="chart">${s.sc.map((v,i)=>`<div><b style="height:${v/m*100*.8}%">${v}</b>${T[i].replace("Maths ","")}</div>`).join("")}</div></div>
<a class="btn wa" target="_blank" rel="noopener" href="${wa(s.ph,msg)}">Share report on WhatsApp</a>`}
function parent(){const s=S[sel];
 return `<div class="c"><div class="mu">Viewing as parent of</div>${opts()}</div>
<div class="grid"><div class="c"><div class="mu">Attendance</div><div class="big">${s.att}%</div></div><div class="c"><div class="mu">Latest score</div><div class="big">${s.sc[5]}</div></div></div>
<div class="c"><div class="b">Homework</div><ul>${HW.map(h=>`<li>${h}</li>`).join("")}</ul></div>
<div class="c r"><div><div class="mu">Fee due</div><div class="big">${s.due?inr(s.due):"₹0"}</div></div>${s.due?`<span class="tag">${s.late} days late</span>`:`<span class="tag g">All paid</span>`}</div>`+
(s.due?`<a class="btn" href="upi://pay?pa=${UPI}&pn=Sunrise%20Tuition&am=${s.due}&cu=INR&tn=Fee%20${encodeURIComponent(s.n)}">Pay by UPI</a><p class="mu" style="text-align:center">Opens GPay, PhonePe or Paytm on your phone</p>`:"")}
function owner(){const t=COLLECTED+pendTotal,pc=Math.round(COLLECTED/t*100);
 return `<div class="c"><div class="r"><div><div class="mu">Collected</div><div class="big" style="color:var(--ok)">${inr(COLLECTED)}</div></div><div style="text-align:right"><div class="mu">Pending</div><div class="big" style="color:var(--bad)">${inr(pendTotal)}</div></div></div><div class="bar" style="margin-top:10px"><i style="width:${pc}%"></i></div><div class="mu" style="margin-top:6px">${pc}% collected this month</div></div>
<div class="grid"><div class="c"><div class="mu">Students</div><div class="big">${S.length}</div></div><div class="c"><div class="mu">New enquiries</div><div class="big">${ENQ.length}</div></div></div>
<button class="btn" style="margin-top:10px" onclick="manage()">Manage students · edit names / add new</button><div class="b" style="margin:14px 2px 0">Referral enquiries</div>`+ENQ.map(e=>`<div class="c r"><div><div class="b">${e[0]}</div><div class="mu">${e[1]}</div></div><span class="tag ${e[2]=="Called"?"g":""}">${e[2]}</span></div>`).join("")}
function manage(){
 shc.innerHTML=`<div class="r"><b>Manage students</b><button class="btn sm" onclick="sh.classList.remove('on');go()">Done</button></div><p class="mu">Each card: Student name · Parent name · WhatsApp number · Fee due (₹). Changes save automatically.</p>`+
 S.map((s,i)=>`<div class="c"><div class="grid" style="gap:8px"><input value="${esc(s.n)}" onchange="ed(${i},'n',this.value)" placeholder="Student name"><input value="${esc(s.p)}" onchange="ed(${i},'p',this.value)" placeholder="Parent name"><input value="${esc(s.ph)}" onchange="ed(${i},'ph',this.value)" placeholder="WhatsApp number" inputmode="tel"><input type="number" value="${s.due}" onchange="ed(${i},'due',this.value)" placeholder="Fee due ₹"></div><button class="btn sm" style="background:var(--bad);margin-top:8px" onclick="rm(${i})">Remove</button></div>`).join("")+
 `<div class="c"><div class="b" style="margin-bottom:8px">➕ Add new student</div><div class="grid" style="gap:8px"><input id="nn" placeholder="Student name"><input id="np" placeholder="Parent name"><input id="nph" placeholder="WhatsApp (10 digits)" inputmode="tel"><input id="nd" type="number" placeholder="Fee due ₹ (if any)"><input id="nl" type="number" placeholder="Days late (if any)"></div><button class="btn" style="margin-top:10px" onclick="addS()">Add student</button></div><button class="btn sm" style="background:var(--mu)" onclick="resetS()">Reset to sample data</button>`;
 sh.classList.add("on")}
function ed(i,k,val){const s=S[i];
 if(k=="due"){s.due=Math.max(0,+val||0);if(!s.due)s.late=0}
 else if(k=="ph"){const d=val.replace(/\D/g,"");s.ph=d.length==10?"91"+d:d}
 else s[k]=val.trim()||s[k];
 save()}
function addS(){const n=nn.value.trim();if(!n){nn.focus();return}
 const d=nph.value.replace(/\D/g,"").slice(-10),due=Math.max(0,+nd.value||0);
 S.push({n,p:np.value.trim()||"Parent",ph:d?"91"+d:"",due,late:due?Math.max(0,+nl.value||0):0,att:100,sc:[0,0,0,0,0,0]});
 mark.push("P");save();manage()}
function resetS(){try{localStorage.removeItem("td_students")}catch(e){}location.reload()}
function rm(i){if(S.length<=1)return;S.splice(i,1);mark.splice(i,1);sel=0;save();manage()}
function toast(m){shc.innerHTML=`<p class="b" style="text-align:center">${m}</p><button class="btn" onclick="sh.classList.remove('on')">OK</button>`;sh.classList.add("on")}
function go(){calc();v.innerHTML=[fees,att,tests,parent,owner][tab]();nv.innerHTML=tabs.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};go();scrollTo(0,0)"><span>${t[0]}</span>${t[1]}</button>`).join("")}
go();
</script></body></html>
